{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<p class="muted">Prototype auth: pick a seeded user to demonstrate role-based access (NFR-02).</p>
<form method="post">
  <select name="username">
    {% for u in users %}
      <option value="{{ u.username }}">{{ u.username }} ({{ u.role }})</option>
    {% endfor %}
  </select>
  <button class="btn" type="submit">Log in</button>
</form>
{% endblock %}
